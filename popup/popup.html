<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI Pet 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #FFB347, #FF8C00);
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .header h2 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .section {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }
    .section h3 {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: #FFB347;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-row span { font-size: 13px; }
    .toggle {
      width: 44px;
      height: 22px;
      background: #ddd;
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.active { background: #FFB347; }
    .toggle::after {
      content: '';
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }
    .toggle.active::after { transform: translateX(22px); }
    .btn-save {
      display: block;
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #FFB347, #FF8C00);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-save:hover { opacity: 0.9; }
    .status {
      text-align: center;
      font-size: 12px;
      color: #4CAF50;
      padding: 8px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🐱 AI Pet 设置</h2>
    <p>v0.1.0 Demo · Codex frontend sync test</p>
  </div>

  <div class="section">
    <h3>API 配置</h3>
    <div class="field">
      <label>API 端点</label>
      <input type="text" id="apiEndpoint" placeholder="http://localhost:8900/api/chat/stream">
    </div>
    <div class="field">
      <label>模型名称</label>
      <input type="text" id="model" placeholder="demo-model">
    </div>
  </div>

  <div class="section">
    <h3>功能开关</h3>
    <div class="toggle-row">
      <span>Demo 模式（Mock 数据）</span>
      <div class="toggle active" id="demoToggle"></div>
    </div>
  </div>

  <div class="section">
    <button class="btn-save" id="saveBtn">保存设置</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
